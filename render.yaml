services:
  - type: web
    name: vitro-downloader
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: INSTAGRAM_COOKIES_BASE64
        sync: false
      - key: FACEBOOK_COOKIES_BASE64
        sync: false
      - key: YOUTUBE_COOKIES_BASE64
        sync: false
